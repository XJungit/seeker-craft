# Craft-Agent 工作区（通用游戏 Agent 框架 · Rust 主框架）
#
# 单一 workspace 的收益（对齐 2026-07-13 结构复审）：
#   - 单一 Cargo.lock：所有成员共享依赖版本，杜绝跨 crate 版本漂移
#   - 单一 target/：xcap/enigo/reqwest 等重依赖只编译一次，成员间复用
#   - [workspace.dependencies]：公共依赖版本单点声明，成员用 `dep.workspace = true`
[workspace]
resolver = "3"
members = [
    "crates/craft-agent",             # 核心：通用抽象（types / GameAdapter / Agent 主循环）
    "crates/craft-agent-model",       # 模型客户端层：VLM(vision) + LLM(decision)，OpenAI 兼容多后端
    "crates/craft-agent-minecraft",   # MC 适配器：mod TCP 桥接（精确状态）+ 可选 VLM 视觉补充
    "crates/craft-agent-viewer",      # 运行可视化：把 session JSONL 渲染成 Web 仪表盘（对话历史 + 工具调用）
    "crates/craft-agent-test-harness", # 全自动测试工具链：程序化测试运行、失败分析、自动修复
    "crates/craft-agent-autopilot",   # 全自动化自进化主循环：无人值守连续运行直至通关
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/anomalyco/craft-agent"

# ===== 公共依赖版本单点声明（成员用 `<dep>.workspace = true` 引用）=====
[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 后端配置（TOML）解析：多 OpenAI 兼容后端，一键切 active
toml = "0.8"
# 阻塞式 HTTP 客户端，便于离线单测；后续主循环接 tokio 时可换异步
reqwest = { version = "0.12", features = ["json", "blocking"] }
# 截图 PNG → base64 data URI（内联进 chat/completions，免第三方图床）
base64 = "0.22"
# 键鼠控制（真机实测 0.6.1，API 与 0.7 不同）
enigo = "0.6.1"
# 截图（真机实测 0.9.6：Window 直捕遮挡免疫，set_dpi_awareness 后坐标=物理像素）
xcap = "0.9.6"
# 注册表读 DPI（AppliedDPI 交叉验证）
winreg = "0.55"
# 图像处理：仅 png 特性，避免 image/default 拉入 ravif/rav1e(AV1 巨量编译)
image = { version = "0.25", default-features = false, features = ["png"] }
# SoM 渲染（画框/圆点/编号文字）
imageproc = "0.25"
# SoM 渲染字体（ab_glyph FontVec 加载系统字体）
ab_glyph = "0.2"
# 项目根 .env 自动加载（密钥放 .env，已被 gitignore；与 setx 持久化互补）
dotenvy = "0.15"
# 内部 crate：核心抽象，供 model 层依赖
craft-agent = { path = "crates/craft-agent" }
# 内部 crate：模型客户端层（VLM/LLM），供 adapter 层依赖
craft-agent-model = { path = "crates/craft-agent-model" }
# 内部 crate：MC 适配器（mod 桥接 + xcap 截图），供 viewer 控制面板依赖
craft-agent-minecraft = { path = "crates/craft-agent-minecraft" }
# Windows 前台窗口接管（AttachThreadInput + SetForegroundWindow）：确保 MC 收到 enigo 合成输入。
# 仅 Windows 编译使用（craft-agent-minecraft 的 [target.'cfg(windows)'.dependencies] 用 .workspace 引用）。
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    "Win32_System_Kernel",
    "Win32_UI_HiDpi",
] }
# Web 运行可视化（craft-agent-viewer）：把 session JSONL 渲染成仪表盘。
# 用 full 避免 axum 特性联合时缺功能编译失败（仅 viewer 依赖，开发期可接受）。
tokio = { version = "1", features = ["full"] }
axum = "0.8"

# ===== 发布优化 =====
[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
