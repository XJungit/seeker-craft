[package]
# 模型客户端层：VLM(vision) + LLM(decision)，均为 OpenAI 兼容端点客户端。
# 原名 craft-agent-vlm，因 decision.rs(LLM) 加入后名不副实，2026-07-13 改名。
name = "craft-agent-model"
version.workspace = true
edition.workspace = true

[dependencies]
craft-agent.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
reqwest.workspace = true
base64.workspace = true
# 图像预处理（VLM 输入缩放 downscale + SoM 渲染 render）：仅在 real 路径需要。
# 默认仅编译 mock，离线单测不带这些重依赖。
image = { workspace = true, optional = true }
imageproc = { workspace = true, optional = true }
# SoM 渲染：加载系统字体（FontVec::try_from_path），ab_glyph 提供 Font trait
ab_glyph = { workspace = true, optional = true }

[features]
# 开启后编译真实 VLM/LLM HTTP 客户端（agnes / minicpm 等）+ 图像渲染（SoM 叠加标注）。
# 默认只编译 mock，便于离线单测。
real = ["dep:image", "dep:imageproc", "dep:ab_glyph"]
