[package]
name = "craft-agent-minecraft"
version.workspace = true
edition.workspace = true

[dependencies]
# 核心抽象（types / GameAdapter / Action / WorldState）—— 单向依赖，core 不反向依赖本 crate
craft-agent.workspace = true
# 模型层（VisionClient / SoM）—— builder / visual_perceive 都需要，默认只编译 mock
craft-agent-model.workspace = true
anyhow.workspace = true
# 项目根 .env 自动加载（示例里用它把 MINICPM_API_KEY 等注入环境，与 setx 持久化互补）
dotenvy.workspace = true
# P1.4 真机依赖（仅 real 特性编译，保持默认构建轻量、无显示亦可编译）
xcap = { workspace = true, optional = true }
enigo = { workspace = true, optional = true }
image = { workspace = true, optional = true }
# VLM 检测坐标解析
regex = "1"
serde_json = "1"
# 桥接 mod 结构化状态（perceive/action 用的 JSON 结构 derive）
serde = { version = "1", features = ["derive"], optional = true }
# 多模态直读：把截图 base64 内联为 data URI（仅 real 路径使用，故 optional）
base64 = { version = "0.22", optional = true }
# Azalea 客户端协议层（Phase 1 转向：替代 Fabric mod TCP 桥接）。
# 仅 azalea feature 编译，默认不引入，保持轻量。
azalea = { path = "D:/azalea/azalea", optional = true }
azalea-client = { path = "D:/azalea/azalea-client", optional = true }
tokio = { version = "1", features = ["full"], optional = true }

[features]
# 开启后接入真实 Minecraft：VLM/SoM 渲染(craft-agent-model/real) + xcap 截图 + enigo 键鼠。
# 默认不开启 → 只编译纯函数（如 to_screen_coords），供离线单测与轻量 CI。
real = ["craft-agent-model/real", "dep:xcap", "dep:enigo", "dep:image", "dep:base64", "dep:serde"]
# 全量 mod 控制：进程内 Fabric mod 桥接（craft-agent-bridge），结构化状态感知 + 进程内动作，
# 彻底移除 enigo 的 OS 级键鼠模拟。基于 real（复用 xcap 截图供 viewer + craft-agent-model/real 的 LLM 客户端）。
mod-bridge = ["real", "dep:serde"]
# Azalea 客户端协议层路线：Rust 全栈 bot 连入普通 MC 服务器（含局域网），
# 用 Azalea(pathfinder 移植自 Baritone) 替代自研 A*。MC 26.2 原生支持。
azalea-bot = ["dep:azalea", "dep:azalea-client", "dep:tokio"]

# 仅 Windows 编译：前台窗口接管（AttachThreadInput + SetForegroundWindow），
# 确保 MC 在独占全屏/后台时收得到 enigo 合成输入（SendInput 只投前台窗口队列）。
[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true
