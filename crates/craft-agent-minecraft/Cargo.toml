[package]
name = "craft-agent-minecraft"
version.workspace = true
edition.workspace = true

[dependencies]
# 核心抽象（types / GameAdapter / Action / WorldState）—— 单向依赖，core 不反向依赖本 crate
craft-agent.workspace = true
anyhow.workspace = true
# 项目根 .env 自动加载（示例里用它把 API_KEY 等注入环境，与 setx 持久化互补）
dotenvy.workspace = true
# blueprint.rs（蓝图模板）与 action_lib.rs（LLM 自定义动作库）用 derive 宏做 JSON 存取
serde.workspace = true
serde_json = "1"
reqwest.workspace = true
# Azalea 客户端协议层（Rust 全栈 bot 连入普通 MC 服务器，MC 26.2 原生支持）。
# azalea 锁定到 26.2 支持的 commit，以 git 源引入（独立 workspace，不与本 workspace 配置冲突）。
# 依赖源是上游 azalea 的维护 fork（XJungit/azalea，craft-agent 分支）：上游 main 缺少本项目
# 弓箭/穿戴所需 API（stop_use_item / use_item_air / force_miss），详见 vendor/azalea 的本地提交。
# 永久写 https 源（可移植，别人 clone 能直接编）；本地离线开发由 .cargo/config.toml 的
# [patch] 自动重定向到 vendor/azalea 本地副本，无需再手动改 file://。
azalea = { git = "https://github.com/XJungit/azalea", rev = "e384e7087de53f6596bc0553659fcb3c80d0e64b", optional = true }
azalea-client = { git = "https://github.com/XJungit/azalea", rev = "e384e7087de53f6596bc0553659fcb3c80d0e64b", optional = true }
azalea-inventory = { git = "https://github.com/XJungit/azalea", rev = "e384e7087de53f6596bc0553659fcb3c80d0e64b", optional = true }
azalea-registry = { git = "https://github.com/XJungit/azalea", rev = "e384e7087de53f6596bc0553659fcb3c80d0e64b", optional = true }
azalea-world = { git = "https://github.com/XJungit/azalea", rev = "e384e7087de53f6596bc0553659fcb3c80d0e64b", optional = true }
azalea-protocol = { git = "https://github.com/XJungit/azalea", rev = "e384e7087de53f6596bc0553659fcb3c80d0e64b", default-features = false, optional = true }
# bevy 应用/ecs（azalea 内部依赖，版本须与 azalea 完全一致，否则 ecs 类型不兼容）
bevy_app = { version = "0.19.0", optional = true }
bevy_ecs = { version = "0.19.0", default-features = false, optional = true }
tokio = { version = "1", features = ["full"], optional = true }
rhai = { version = "1.25.1", features = ["sync", "serde"] }

[features]
# 唯一路线：Azalea 客户端协议层（Rust 全栈 bot 直连普通 MC 服务器）。
# 旧 mod-bridge / real（Fabric mod TCP 桥接 + 真机 VLM 键鼠）路线已从源码删除。
azalea-bot = ["dep:azalea", "dep:azalea-client", "dep:azalea-inventory", "dep:azalea-registry", "dep:azalea-world", "dep:azalea-protocol", "dep:bevy_app", "dep:bevy_ecs", "dep:tokio"]

# 仅 Windows 编译：前台窗口接管（AttachThreadInput + SetForegroundWindow），
# 确保 MC 在独占全屏/后台时收得到 enigo 合成输入（SendInput 只投前台窗口队列）。
[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true
