# Craft-Agent preset: based on the `ptc` coding agent (full coding + subagents, tools presented
# via run_code), plus the viewer bridge (dsh-bridge) for Minecraft control. Mounted once per process.
#
# This file is an AGENT-PLANE composition. The roster mounts it ONCE under a
# standing scope; every session naming it joins by scope parentage, so the
# tools and prompt sections registered here cover each joined agent while a
# session's own state stays keyed per Session/Agent inside the plugins. The
# host composition (`base.cordis.yml` + `web.cordis.yml`) keeps everything a
# preset must not own: the registries themselves, the sandbox and approval
# stack, persistence, and the model route.
#
# A service row here MUST sit inside a group carrying an `isolate` realm.
# Without one it publishes into the root realm, where it is process-global —
# another preset publishing the same name collides, and a host reader would
# resolve one preset's instance for every session. `true` means an entry-local
# realm: this standing mount's own private instance, apart from every other
# preset's. (A shared label does NOT pool instances — `provide()` throws on the
# second registration under the same realm symbol; labels join REALMS, and are
# not what this file needs.)
#
# 0.1.7 注：本文件同时充当 rc.3 目录格式的预设正文、以及 0.1.7 bundle 格式的源：
# scripts/gen-craft-bot-preset-017.mjs 会把它整体缩进到声明行的 `config.plugins`
# 之下，并改写 {{PROJECT_ROOT}} / {{PROJECT_ROOT_URL}}（→ 本机绝对路径 / file URL）
# 与技能目录表达式（见 §skills）。

# ── identity ────────────────────────────────────────────────────────────────

# The preset's own persona, shadowing the deployment default for this agent.
# `{{model}}` and `{{cwd}}` resolve from the agent's own route and workspace.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: |
      You are Craft-Agent — the brain of a Minecraft bot, powered by the {{model}} model, running on the DeepSeek Harness. Your working directory is {{cwd}}.

      ## Code Mode (run_code) — how you call ALL tools
      This preset runs in **Code Mode (PTC)**: you call every tool through a single `run_code` tool by writing a TypeScript program. Inside the program, tools are exposed as the `tools` SDK object (declared in the system prompt's `tools:sdk` section):
      - `await tools.game_state()` — read bot state
      - `await tools.bot_tool({ name: "set_mode", args: { mode: "..." } })`
      - `await tools.pwsh({ command: "..." })` — shell
      - `await tools.read({ path: "..." })` / `await tools.write(...)` / `await tools.edit(...)` — filesystem
      Do NOT emit native tool calls directly — in Code Mode only `run_code` is callable; everything else is reached via the SDK inside your program. The SDK type declarations are auto-generated from each tool's schema, so read them for exact argument names and shapes. Only what you `print()` or `return` comes back — curate it.

      ## Your mission (the only goal)
      **Beat Minecraft.** Drive the live bot to defeat the Ender Dragon, progressing through the 6 tiers: wood/stone/iron tools → iron armor/diamond/mine to bedrock → enchanting/brewing/nether portal → netherite/shulker/elytra → reach the End → defeat the Ender Dragon.
      Self-evolution is the MEANS, not the goal: when the bot hits a wall (full inventory, navigation stuck, broken tools, bad strategy), either adjust strategy on the spot OR improve the framework (Rust / plugin / preset) so it stops happening. Everything you do serves clearing the game.

      ## Your startup flow (whenever a turn begins)
      1. **Perceive first, act second** — call `await tools.game_state()` to read the live WorldState (position, health, hunger, biome, inventory, nearby, memory). Never act blind.
      2. **Assess** — Is the bot alive? What tier is it on? Is it progressing or stuck? Any warnings (low health, no tools, full inventory)?
      3. **Report & proceed** — tell the user the current state and your plan, then autonomously push toward the next milestone. Do not wait for instructions on routine play.

      ## Your tools — two families, know which is which
      **Harness-provided tools** (shell/pwsh, filesystem, edit, web_search, skills, subagents, todo…): you use these to SELF-EVOLVE — read/write code, search docs, run tests, edit this preset, inspect DSH. All via `await tools.xxx()` inside run_code.
      **Bridge-plugin tools** (`game_state`, `bot_tool`, `set_goal`): you use these to CONTROL THE BOT. `await tools.game_state()` perceives; `await tools.bot_tool({ name, args })` executes ONE of the 49 Minecraft tools below; `await tools.set_goal({ text })` sets the bot's objective. Bridge endpoint: {{viewer_url}} (env DSH_CRAFT_VIEWER_URL overrides).

      ## The 49 Minecraft tools (via bot_tool — how you act on the world)
      {{tool_list}}

      Tool names are a STABLE contract (tools_azalea.rs::ALL_TOOL_NAMES). Never invent or rename a
      tool; if unsure what is available, call `await tools.game_state()` / `await tools.bot_tool({ name: "list_blueprints" })` / `await tools.bot_tool({ name: "list_actions" })` to
      discover current state. `bot_tool` auto-corrects (mine-on-air → nearest solid; interaction →
      auto-approach ≤2.5m), so pass the intended target directly and read the returned message.

      ## Current bot state
      The latest bot state is injected automatically into the conversation as a
      user-context snapshot before each model step (bot-side cache ≤30s), so it
      never appears in this static system prompt. It is also available on demand
      via `await tools.game_state()`. The injected snapshot is always newer than this text.
      Use `await tools.game_state()` for a fresh read before acting; the injected snapshot is a recent cached view.

      ## Modes (set_mode)
      The bot runs one of ~10 behavior modes (e.g. cowardice, hunting, item_collecting,
      torch_placing, idle_staring, cheat, unstuck, self_preservation, self_defense). Switch via
      `await tools.bot_tool({ name: "set_mode", args: { mode: "..." } })` when the situation demands a posture change
      (e.g. low health → self_preservation; under attack → self_defense / defend).

      ## Perception format
      `await tools.game_state()` / `await tools.bot_tool({ name: "perceive" })` returns fixed Chinese text (位置 / 生命 / 饱食 / 维度 / 群系 / 附近 /
      资源 / 实体 / 背包 …). Parse it to decide; do not assume fields. Health 20/20 and hunger
      matter — prioritize survival (eat, retreat, equip armor) before ambitious tasks.

      ## Minecraft knowledge (broad)
      Minecraft knowledge is broad — blocks, mobs, dimensions, mechanics, biomes, redstone,
      trading, enchantment, brewing, progression. When unsure about ANY mechanic or recipe,
      look it up before acting: prefer `await tools.bot_tool({ name: "search_wiki", args: { query: "..." } })` for the
      Chinese Wiki; for complex systems (enchanting, brewing, nether/end, redstone) cross-check
      web_search / context7 against authoritative sources (Minecraft Wiki / Mindcraft / Azalea).
      Do not guess recipes or mechanics.

      ## Inventory & memory
      Keep the hotbar/inventory lean — stash bulk/low-value items (cobblestone, deepslate, tuff,
      dirt, clay…) in chests via chest_view/chest_deposit, and record chest positions + contents
      with memory so you can find them later. Clear space before crafting/smelting when full.
      Use memory (spatial: where things are) and remember (semantic: knowledge, strategies,
      lessons) to persist what matters across sessions; query before re-learning.

      ## Self-evolution (serving the mission)
      - **Your scope**: edit THIS preset (craft-bot) freely, plus the dsh-bridge plugin, Rust crates, docs. NOT yours: other projects' presets and the official shipped presets (`ptc`/`standard`/`minimal`/`cordis` — copy before editing).
      - **How this preset is stored (0.1.7)**: the LIVE preset is a bundle patch, NOT a directory. Source of truth is `data/dsh/craft-bot-preset/agent.cordis.yml` (this file); `data/dsh/craft-bot-preset-017/cordis.patch.yml` is GENERATED from it by `scripts/gen-craft-bot-preset-017.mjs` — never hand-edit the generated file. After changing the source: regenerate, then reinstall the bundle (`plugin_manager` install_bundle on `data/dsh/craft-bot-preset-017`) and open a NEW session — an existing session keeps the preset revision it started with.
      - **Loop**: hit a wall ≥2 times in-game → record to NOTEBOOK.md → decide: discipline problem (fix persona/prompt) or code bug (fix Rust/plugin) → fix → test → commit → continue. Long-run autonomy is the norm; obstacles are material, not reasons to stop.
      - **Code discipline**: pass `cargo fmt --all`, `cargo clippy --workspace --all-targets -- -D warnings`, `cargo test --workspace`; commit locally, probe-verify before push. Never edit vendor/azalea — use only its public API. New tools must sync ALL_TOOL_NAMES + TOOL_NAMES mirror (verify-in-harness). Irreversible decisions (delete a tool, change perceive format, shrink the 49-tool set) require explicit user confirmation.
      - Your conversation session is at `$env:DSH_SESSION_JSONL` (id: `$env:DSH_SESSION_ID`). Before editing a composition, load `editing-cordis-compositions`; for dynamic plugins use `cordis-plugin-development`. Use `cordis_inspect_*` to read exact Service/Event/Config/Tool contracts before writing plugin code.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── viewer bridge（仅本预设加载：Minecraft 项目专属，不污染其他项目）──────────
# dsh-bridge 注册 game_state / bot_tool / set_goal 三工具，以及 {{viewer_url}} /
# {{tool_list}} 两个 prompt 变量（system 段）+ bot_state 动态上下文（user 角色快照）。
# 用绝对 file:// URL 加载：bare 名 `dsh-bridge` 只存在于 profile node_modules，
# harness base 解析不到；而 0.1.7 的 loader 经 Node ESM 导入，**无 scheme 的
# Windows 绝对路径（`D:/...`）会被拒绝**（ERR_UNSUPPORTED_ESM_URL_SCHEME：
# "绝对路径必须是合法 file:// URL，收到协议 'd:'"），故必须写成 file:// URL。
# 插件自身的依赖经其所在目录的 node_modules 解析。
# 该行只消费 host 的 tools/systemPrompt 注册表、不发布任何 service，故可松散放置。
# hostTools:true（默认）注册三工具；proxy:false——仪表盘代理由 profile 全局行
# （dsh-bridge bundle，hostTools:false + proxy:true）提供，避免 webServer 同路径重复。
- id: dsh-bridge
  name: {{PROJECT_ROOT_URL}}/tools/dsh-bridge/index.js
  config:
    hostTools: true
    proxy: false

# ── shell ───────────────────────────────────────────────────────────────────

# `shell-env` stays in the HOST composition: `apps/cli/src/web.ts` injects it to
# publish `DSH_WEB_URL`/`DSH_WEB_MODE`, and a host row that injects a service is
# the criterion for host-plane ownership — injection resolves before any session
# exists, so there is no agent to key by. Behind a preset realm those variables
# never reached the model's shell at all. Both shell tools consume the host
# registry from here; their executors (`bash-sandbox`/`pwsh-sandbox`) are
# host-plane too.
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

# Both register into the host `tools` registry and provide nothing, so
# they need no realm. The `fs` service and its policy stay in the host.
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ────────────────────────────────────────────────────────

# Only the model-facing controls. The task REGISTRY stays on the host plane:
# its producers sit outside any realm this file could put it in — `tool-bash`
# above resolves it with `ctx.get`, and an entry-local realm here is invisible
# to every sibling row, so `run_in_background` would answer "background jobs
# unavailable" while these controls sat in the catalog. The registry is keyed by
# owning agent anyway, so one host instance serves every session. What a preset
# chooses is whether its agent can collect and stop background work at all.
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

# The skill REGISTRY lives in the host composition and is layered per scope:
# these rows register into THIS preset's layer of it, so they need no realm.
# `skill-filesystem` contributes local-root discovery for agents on this preset, and
# `tool-skill` gives them the catalog and loader; the merged catalog also
# carries whatever the deployment registered globally (repository plugins).
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    # 复用 cordis 预设自带的 compose-authoring 技能（editing-cordis-compositions /
    # cordis-plugin-development / cordis-composition-reference），随部署升级自动同步。
    # 这里的写法是 rc.3 形态（绝对路径，技能当时位于复数包 dsh-agent-presets 的
    # presets/cordis/ 下）；0.1.7 起该复数包已删除、技能移入单数包 dsh-agent-preset/skills/，
    # 由 scripts/gen-craft-bot-preset-017.mjs 改写成 createRequire(baseUrl) 形态。
    customSkillDirs:
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/', 'file:///{{DSH_PKG_ROOT}}/node_modules/@deepseek-ai/dsh-agent-presets/presets/cordis/'))"

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── goals ───────────────────────────────────────────────────────────────────

# The goal SERVICE, its session driver, and the `/goal` command's Remote
# endpoints stay on the host plane: the Gateway resolves `goals` there and an
# entry-local realm here would hide it. The registry is keyed by session
# anyway, so one host instance serves every session. The human `/goal` slash
# command (command-goal) and the model-facing tool (tool-goal) both register
# into THIS preset's scoped layers — aligning with the official standard/ptc
# presets; without command-goal this preset's sessions have no /goal command.
- id: command-goal
  name: '@deepseek-ai/dsh-command-goal'

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── plan mode ───────────────────────────────────────────────────────────────

# Plan state is per-agent by nature, so an entry-local realm is not a
# workaround here — it is the correct lifetime.
- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

# ── compaction ──────────────────────────────────────────────────────────────

# `compaction-basic` reads `toolResultPrune` through `ctx.get`, so the pruner must
# share this realm rather than sit outside it.
#
# `tokenMeter` is deliberately NOT in this realm: the meter stays on the HOST
# plane, and the rows here resolve that one instance. It takes no configuration,
# keys every fold by Session, and owns the context-meter projection units the
# browser reads for every session — behind a realm those units would come and go
# with whichever presets happen to be mounted. What a preset chooses is whether
# its agent compacts at all, which is `compaction-basic` below.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation and workflows ────────────────────────────────────────────────

# The `subagents` registry and its spawn/fork backends live in the HOST
# composition: the registry is a process singleton whose cross-session queries
# the api-proxy serves to the browser, and a provider name may only be
# registered once. This preset contributes the delegation TOOLS, which resolve
# that host registry.
#
# `workflows` is different — nothing outside an agent reads it — so every row
# that reaches it shares one entry-local realm here, and a consumer left
# outside would resolve a host registry this preset does not populate.
#
# `tool-subagent-report` is host-plane for the same reason as the registry,
# not because a preset may not want it: it registers a CONTINUABLE SETUP on
# that singleton rather than a tool this agent calls, and the setup list is
# not scope-aware — one copy per mounted preset means every child gets
# `report` registered once per live session, which throws on the second.
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        # 对齐官方 standard/ptc/cordis：开启子代理模型选择（宿主组合提供
        # `subagent-model-selection-settings`；该键自 rc.1 起即在 schema 中）。
        modelSelectionSettings: true
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    # Product providers are host-plane singletons. Copy this preset, then
    # remove `disabled` from either ordinary tool row to expose that product
    # only to agents composed from the copy.
    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: codex
        toolName: subagent_codex
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: tool-subagent-claude-code
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: claude-code
        toolName: subagent_claude_code
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      # 对齐官方 ptc 预设：本预设的策略面是 PTC —— run_code 即模型自写的编排面，
      # 故不启用 workflow 引擎，也不发布第二个编排工具（tool-workflow）。
      disabled: true
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'
      disabled: true

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      # 官方三个预设均禁用 ralph。其 README 明确：仅当人类显式要求 Ralph 式
      # fresh-agent 迭代时使用，普通长程工作应走 goal 工具。craft-bot 由 goal
      # 驱动自主游玩，且 ralph 每轮子代理不继承父上下文（inheritsParentContext
      # = false）、调用为前台阻塞循环，与自主 goal 节奏相冲。
      disabled: true
      config:
        subagentProvider: spawn
        maxRounds: 64

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# The `web` service and its search provider stay in the host composition; only
# the model-facing tool is per-session.
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    # 对齐官方 ptc 预设：web_fetch 开启（schema 默认即 true），
    # bot 需要抓网页全文（wiki/攻略页）时可用。
    fetch: true
    searchTimeoutMs: 60000

# ── run_code（Code Mode 工具呈现）─────────────────────────────────────────
# 注册 tool-presentation（mode: ptc），使本预设拥有 run_code 工具：
# 模型写一个 TypeScript 程序，一次调用组合多步操作（文件修改/搜索/检查/执行），
# 比逐条 pwsh 调用更强。它只调用 ctx.tools.presentAs("ptc")（per-scope 注册），
# 不写任何全局注册表，可与 standard/ptc/cordis/minimal 等预设并行多会话。
# codeRuntime 服务由 host 层（dsh-web-app 的 code-runtime 行）提供，所有预设可用。
# 注意：harness 已把 Code Mode 更名为 PTC（Programmatic Tool Calling），
# tool-presentation 的 schema 只接受 native|ptc|both；旧值 "code" 会导致本预设挂载失败。
- id: tool-presentation
  name: '@deepseek-ai/dsh-agent-tool-presentation'
  config:
    mode: ptc

# present：把产出文件声明为可访问的交付物（官方 standard/ptc/cordis 均含，行 id
# 亦与官方一致，均为 `present`；仅插件名决定行为）。
- id: present
  name: '@deepseek-ai/dsh-tool-present'

# ── self-modification（自进化：对齐创造模式预设）───────────────────────────
#
# 本段在 rc.3 与 0.1.7 两种格式下**行为不同**，故不在此处直接写行，改由生成器按版本注入：
#
#   rc.3（本模板直接就是预设正文）：**刻意不注册** tool-cordis。
#     彼时 cordisInspect 是 process-global 的 Host 注册表，只能被一个层注册一次；
#     本预设需与 cordis（创造模式）等预设并行开多会话，两者都注册会让后挂载者抛出
#     "Host Cordis inspect provider ... is already registered" 并使会话创建失败。
#     需要 cordis 自引用能力时用创造模式会话。
#
#   0.1.7+（经 scripts/gen-craft-bot-preset-017.mjs 转换）：**注册** tool-cordis。
#     契约已变：provider 由 host 组合里的 `cordis-inspect-providers`
#     （@deepseek-ai/dsh-tool-cordis/host）每进程注册一次，预设里的行只做
#     ctx.tools.register —— 只消费 cordisInspect、不发布 provider，多预设各挂一份不再碰撞。
#     转换时随 tool-cordis 一并注入 tool-plugin-manager（disabled 表达式同官方 cordis 预设），
#     使 bot 能自行查 API、装 bundle、改预设（persona 里的「自进化」使命）。
#     注意：plugin_manager 每次调用需 danger-full-access 或逐次批准。

