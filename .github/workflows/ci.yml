name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  quality:
    name: fmt + clippy
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly-2026-07-21 toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "nightly-2026-07-21"
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt (check)
        run: cargo fmt --all -- --check
      - name: cargo clippy (strict, incl. azalea-bot)
        run: cargo clippy --workspace --all-targets --features craft-agent-minecraft/azalea-bot -- -D warnings
      - name: cargo check craft-agent-model boundary (no default features)
        run: cargo check -p craft-agent-model --no-default-features

  test:
    name: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly-2026-07-21 toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "nightly-2026-07-21"
      - uses: Swatinem/rust-cache@v2
      - name: cargo test (default features)
        run: cargo test --workspace --no-fail-fast
      - name: cargo test (azalea-bot)
        run: cargo test -p craft-agent-minecraft --features azalea-bot --lib

