name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  # 每日定时构建：防止依赖/工具链漂移在 push 前积累
  schedule:
    - cron: "0 0 * * *"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  quality:
    name: fmt + clippy
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly-2026-07-21 toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "nightly-2026-07-21"
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt (check)
        run: cargo fmt --all -- --check
      - name: cargo clippy (strict, incl. azalea-bot)
        run: cargo clippy --workspace --all-targets --features craft-agent-minecraft/azalea-bot -- -D warnings
      - name: validate data JSON (tasks/profiles/blueprints/actions)
        run: python scripts/ci/validate_data_json.py

  test:
    name: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly-2026-07-21 toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "nightly-2026-07-21"
      - uses: Swatinem/rust-cache@v2
      - name: cargo test (default features)
        run: cargo test --workspace --no-fail-fast
      - name: cargo test (azalea-bot)
        run: cargo test -p craft-agent-minecraft --features azalea-bot --lib

  coverage:
    name: coverage (llvm-cov)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly-2026-07-21 toolchain (llvm-tools)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "nightly-2026-07-21"
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      - name: Generate coverage (lcov, incl. azalea-bot)
        run: cargo llvm-cov --workspace --features craft-agent-minecraft/azalea-bot --lcov --output-path lcov.info
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov.info
