name: Security Audit

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: cargo audit
    runs-on: ubuntu-latest
    permissions:
      checks: write
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run cargo audit
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # rustsec/audit-check v2 仅支持 token/ignore/working-directory 三个输入；
          # 它只上传 SARIF 检查（checks: write），不会自动开 issue。
          # informational warnings（unmaintained/unsound）不阻塞 job。
          # 本地忽略清单见 .cargo/audit.toml（随仓库提交，CI 与本地一致）。