name: Deploy Docs

on:
  push:
    branches: [main, master]
    # 非代码变更（preset/scripts/纯文档）不触发 cargo doc
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  docs:
    name: rustdoc + GitHub Pages
    # rustdoc 只做文档生成，无需 MSVC 链接——ubuntu 比 windows 快且便宜。
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly-2026-07-21 toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "nightly-2026-07-21"
      - uses: Swatinem/rust-cache@v2
      # B方案：azalea/bevy/reqwest 的传递 -sys 依赖在 Linux 要系统库
      #（pkg-config+openssl 给 reqwest；alsa+udev 给 bevy；xkb+X11 给 winit 系）。
      # Windows 有 SDK 全家所以一直绿，ubuntu-runner 裸机则挂在这里。
      - name: Install Linux system deps (reqwest/bevy -sys)
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libasound2-dev libudev-dev libxkbcommon-dev libx11-dev
      - name: cargo doc (workspace, incl. azalea-bot)
        run: cargo doc --workspace --no-deps --features craft-agent-minecraft/azalea-bot
      - name: Generate root index (cargo doc has no workspace landing page)
        shell: bash
        run: |
          cat > target/doc/index.html <<'EOF'
          <!DOCTYPE html>
          <html><head><meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=craft_agent/index.html">
          <title>Craft-Agent Docs</title></head>
          <body><p>Redirecting to <a href="craft_agent/index.html">Craft-Agent docs</a>...</p></body></html>
          EOF
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/doc
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
