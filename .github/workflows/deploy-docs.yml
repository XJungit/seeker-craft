name: Deploy Docs

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  docs:
    name: rustdoc + GitHub Pages
    runs-on: windows-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly-2026-07-21 toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "nightly-2026-07-21"
      - uses: Swatinem/rust-cache@v2
      - name: cargo doc (workspace, incl. azalea-bot)
        run: cargo doc --workspace --no-deps --features craft-agent-minecraft/azalea-bot
      - name: Generate root index (cargo doc has no workspace landing page)
        shell: bash
        run: |
          cat > target/doc/index.html <<'EOF'
          <!DOCTYPE html>
          <html><head><meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=craft_agent/index.html">
          <title>Craft-Agent Docs</title></head>
          <body><p>Redirecting to <a href="craft_agent/index.html">Craft-Agent docs</a>...</p></body></html>
          EOF
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/doc
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4